<!doctype html>
<!-- Galeria klocków UI Nuvio: każdy klocek w każdym stanie, rozmiary S / M / L, motyw jasny i ciemny.
     Uruchomienie: python3 tools/build.py && python3 -m http.server 8000, potem http://localhost:8000/tests/ui-gallery.html -->
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvio UI</title>
<style>
  body{ margin:0; font-family:system-ui,sans-serif; background:#0d1218 url(../dist/nuvio-bg-default-wide.webp) center/cover fixed; color:#fff; }
  .scheme{ padding:24px; display:grid; gap:20px; }
  h2{ margin:0; font-weight:500; font-size:18px; text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .row{ display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .box{ container-type:inline-size; }
  .box.s{ width:180px; } .box.m{ width:300px; } .box.l{ width:460px; }
  .lab{ font-size:12px; opacity:.8; margin:0 0 6px 4px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
</style></head><body>
<div id="out"></div>
<script type="module">
const v = await (await fetch('../dist/nuvio-version.json', { cache: 'no-store' })).json();
window.__hgDryRun = true;
for (const t of ['ha-card', 'ha-icon']) if (!customElements.get(t)) customElements.define(t, class extends HTMLElement {});
await import('../dist/' + v.core);
const ui = window.__nuvioUI || window.__hgUI;
const css = ui.base() + ui.css();
const demos = [
  ['Przycisk ikony', () => ['mdi:magnify', 'mdi:plus', 'mdi:minus', 'mdi:close'].map((i, k) => ui.iconBtn(i, 'x', i, { on: k === 0 })).join(' ') + ' ' + ui.iconBtn('mdi:dots-vertical', 'x', 'menu', { bare: true, size: 'sm' })],
  ['Pigułki i zakładki', () => ui.pill('Popołudnie', { icon: 'mdi:clock-outline' }) + ' ' + ui.pill('Auto', { act: 'm', on: true }) + ' ' + ui.pill('Grzanie', { act: 'm', acc: true }) + '<div style="height:10px"></div>' + ui.tabs([{ id: 'd', label: 'Panel' }, { id: 'r', label: 'Pokoje' }, { id: 'u', label: 'Urządzenia' }], 'd', 'tab', 'Widoki')],
  ['Przełącznik i nagłówek', () => ui.header('Salon', { right: ui.switch(true, 't', 'Salon') + ui.iconBtn('mdi:dots-vertical', 'm', 'menu', { bare: true, size: 'sm' }) }) + ui.header('Kuchnia', { sub: 'wyłączone', right: ui.switch(false, 't', 'Kuchnia') }) + ui.header('Wi-Fi', { sub: '(RayFi_03)', right: ui.switch(true, 't', 'Wi-Fi', true) })],
  ['Duża wartość', () => ui.big(23, { unit: '°', sup: true, size: 'xl', col: true, caption: '23 stopnie za 8 minut' }) + ui.big(62, { unit: '%', caption: 'Średnio' })],
  ['Pasek', () => ui.big(62, { unit: '%', caption: 'Średnio', size: 'sm' }) + '<div style="height:8px"></div>' + ui.progress(62, { min: '0', max: '100%' }) + '<div style="height:12px"></div>' + ui.progress(88, { tone: 'warn' }) + '<div style="height:12px"></div>' + ui.progress(4)],
  ['Łuk', () => ui.big(86, { unit: '%', caption: 'Wysoko', size: 'sm' }) + ui.arc(86, { label: 'Jasność' })],
  ['Wykres', () => ui.spark([4, 6, 5, 8, 7, 9, 6, 7, 5, 8, 10, 9, 11, 12.4], { tip: '12,4 kWh', axis: ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'Sb', 'Nd'], tone: 'solar' })],
  ['Awatary', () => ui.avatars([{ name: 'Anna', home: true }, { name: 'Marek' }, { name: 'Zosia', home: true }], { add: 'add' })],
];
const out = document.getElementById('out');
const sch = new URLSearchParams(location.search).get('scheme') === 'light' ? 'light' : 'dark';
document.documentElement.setAttribute('data-hg-scheme', sch);
{
  const sec = document.createElement('div'); sec.className = 'scheme'; sec.innerHTML = `<h2>Motyw ${sch === 'dark' ? 'ciemny' : 'jasny'} (?scheme=light / dark)</h2>`; out.appendChild(sec);
  for (const [name, fn] of demos) {
    const row = document.createElement('div'); row.className = 'row'; sec.appendChild(row);
    for (const sz of ['s', 'm', 'l']) {
      const box = document.createElement('div'); box.className = 'box ' + sz; row.appendChild(box);
      box.innerHTML = `<div class="lab">${name} · ${sz.toUpperCase()}</div>`;
      const host = document.createElement('div'); host.dataset.scheme = sch; box.appendChild(host);
      const r = host.attachShadow({ mode: 'open' });
      r.innerHTML = `<style>${css}</style><ha-card class="glass" style="display:block;height:auto">${fn()}</ha-card>`;
    }
  }
}
{
  /* nakładki: przyciski otwierają dialog, alert, arkusz, menu, popover, toast; tooltip po najechaniu (title) */
  const ov = window.__nuvioOverlay || window.__hgOverlay;
  const sec = document.createElement('div'); sec.className = 'scheme'; sec.innerHTML = '<h2>Nakładki</h2>'; out.appendChild(sec);
  const host = document.createElement('nuvio-gallery'); sec.appendChild(host); const r = host.attachShadow({ mode: 'open' });
  r.innerHTML = `<style>${css}</style><ha-card class="glass" style="display:flex;gap:8px;flex-wrap:wrap;padding:16px">` +
    ['dialog', 'alert', 'sheet', 'menu', 'popover', 'toast'].map((k) => ui.pill(k, { act: k })).join('') + ui.iconBtn('mdi:information-outline', 'tip', 'Podpowiedź: tooltip') + '</ha-card>';
  const go = { dialog: () => ov.dialog({ title: 'Scena „Wieczór”', text: 'Przyciemnia salon do 30% i zasuwa rolety.', actions: [{ label: 'Anuluj', value: 0 }, { label: 'Uruchom', value: 1, kind: 'primary' }] }),
    alert: () => ov.alert('Wyłączyć wszystko?', 'Zgasną wszystkie światła i urządzenia w domu.', 'Wyłącz'),
    sheet: () => ov.sheet({ title: 'Salon', html: '<p style="margin:0">Treść arkusza: ustawienia pokoju, lista urządzeń.</p>' }),
    menu: (b) => ov.menu(b, [{ label: 'Edytuj', icon: 'mdi:pencil' }, { label: 'Duplikuj', icon: 'mdi:content-copy' }, { label: 'Auto', checked: true }, '-', { label: 'Usuń', icon: 'mdi:delete', danger: true }]),
    popover: (b) => ov.popover(b, '<div style="padding:8px 10px;font-size:13px">Zużycie dziś: <b>12,4 kWh</b></div>'),
    toast: () => ov.toast('Zapisano układ', { onAction: () => {}, action: 'Cofnij' }) };
  r.addEventListener('click', (e) => { const b = e.composedPath().find((n) => n.dataset && n.dataset.act); if (b && go[b.dataset.act]) go[b.dataset.act](b); });
  window.__gal = r;
}
{
  /* nowe karty ogólne z przykładowymi danymi: każda w rozmiarach S, M i L */
  const now = Date.now(), st = (e, state, a) => [e, { entity_id: e, state: String(state), attributes: a || {}, last_changed: new Date(now).toISOString(), last_updated: new Date(now).toISOString() }];
  const S = Object.fromEntries([st('light.salon', 'on', { friendly_name: 'Salon', brightness: 219, supported_color_modes: ['brightness'] }), st('switch.kuchnia', 'off', { friendly_name: 'Kuchnia' }),
    st('fan.sypialnia', 'on', { friendly_name: 'Wentylator', percentage: 66, percentage_step: 1, preset_modes: ['auto', 'sleep', 'turbo'], preset_mode: 'auto' }),
    st('sensor.energia', '62', { friendly_name: 'Zużycie energii', unit_of_measurement: '%' }), st('sensor.solar', '12.4', { friendly_name: 'Energia słoneczna', unit_of_measurement: 'kWh' }),
    st('sensor.temp', '22.5', { friendly_name: 'Temperatura', unit_of_measurement: '°C', device_class: 'temperature' }), st('sensor.wilg', '48', { unit_of_measurement: '%' }),
    st('cover.roleta', 'open', { friendly_name: 'Roleta salon', current_position: 40, supported_features: 15 }), st('lock.drzwi', 'locked', { friendly_name: 'Drzwi wejściowe' }),
    st('todo.zakupy', '2', { friendly_name: 'Zakupy' }), st('scene.wieczor', 'scening', { friendly_name: 'Wieczór', icon: 'mdi:weather-night' }), st('script.film', 'off', { friendly_name: 'Film', icon: 'mdi:movie-open' }),
    st('person.anna', 'home', { friendly_name: 'Anna' }), st('person.marek', 'not_home', { friendly_name: 'Marek' }), st('person.zosia', 'home', { friendly_name: 'Zosia' })]);
  const hass = { states: S, user: { name: 'Krzysztof Czepiec' }, language: 'pl', locale: { language: 'pl' }, themes: { darkMode: sch === 'dark' }, callService: async () => {},
    callWS: async (m) => m.type === 'todo/item/list' ? { items: [{ uid: '1', summary: 'Kupić mleko', status: 'needs_action' }, { uid: '2', summary: 'Podlać kwiaty', status: 'needs_action' }, { uid: '3', summary: 'Wynieść śmieci', status: 'completed' }] }
      : m.type === 'history/history_during_period' ? { [m.entity_ids[0]]: Array.from({ length: 60 }, (_, i) => ({ s: String(6 + Math.sin(i / 6) * 3 + i / 10), lu: (now - (60 - i) * 24 * 60e3) / 1000 })) } : {} };
  const cards = [['hero', {}], ['toggle', { entity: 'light.salon' }], ['progress', { entity: 'sensor.energia', warn: 80 }], ['arc', { entity: 'light.salon' }], ['chart', { entity: 'sensor.solar', tone: 'solar' }],
    ['chart', { entity: 'sensor.solar', style: 'bars' }], ['room-compact', { name: 'Salon', temperature: 'sensor.temp', humidity: 'sensor.wilg', entity: 'light.salon' }],
    ['actions', { actions: [{ icon: 'mdi:magnify', name: 'Szukaj' }, { entity: 'scene.wieczor' }, { entity: 'script.film' }, { icon: 'mdi:close', name: 'Wyłącz' }] }],
    ['family', {}], ['cover', { entity: 'cover.roleta' }], ['lock', { entity: 'lock.drzwi' }], ['fan', { entity: 'fan.sypialnia' }], ['todo', { entity: 'todo.zakupy' }],
    ['stack', { cards: [{ type: 'custom:nuvio-toggle-card', entity: 'light.salon' }, { type: 'custom:nuvio-toggle-card', entity: 'switch.kuchnia' }] }],
    ['tabs', { tabs: [{ label: 'Panel', cards: [{ type: 'custom:nuvio-progress-card', entity: 'sensor.energia' }] }, { label: 'Pokoje', cards: [{ type: 'custom:nuvio-toggle-card', entity: 'switch.kuchnia' }] }] }]];
  const sec = document.createElement('div'); sec.className = 'scheme'; sec.innerHTML = '<h2>Karty</h2>'; out.appendChild(sec);
  const H0 = { hero: 150, toggle: 70, actions: 80, stack: 160, tabs: 240, family: 200, lock: 170, progress: 170, todo: 300, 'room-compact': 190 };
  for (const [n, cfg] of cards) { const row = document.createElement('div'); row.className = 'row'; sec.appendChild(row);
    for (const sz of ['s', 'm', 'l']) { const box = document.createElement('div'); box.className = 'box ' + sz; row.appendChild(box); box.innerHTML = `<div class="lab">${n} · ${sz.toUpperCase()}</div>`;
      const el = document.createElement('nuvio-' + n + '-card'); el.setConfig({ type: 'custom:nuvio-' + n + '-card', ...cfg }); el.style.cssText = `display:block;height:${H0[n] || 240}px`; box.appendChild(el); el.hass = hass; } }
}
window.__ready = true;
</script></body></html>
