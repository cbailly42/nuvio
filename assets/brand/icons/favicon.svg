    .frame, .door { fill: #13211A; }
    @media (prefers-color-scheme: dark) { .frame { fill: #FFFFFF; } .door { fill: #63D71E; } }
  </style>
  <path class="frame" d="M1 15 V8 A7 7 0 0 1 15 8 V15 H12 V8 A4 4 0 0 0 4 8 V15 Z"/>
  <path class="door" d="M6 15 V10 A2 2 0 0 1 10 10 V15 Z"/>
</svg>
